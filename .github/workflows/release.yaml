name: Release
on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
          - bump-patch


jobs:
  build:
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'rel-v')
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      mode: release
      run-tests: true

  release-to-github-and-bump:
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'rel-v')
    uses: gardener/cc-utils/.github/workflows/release.yaml@master
    needs:
      - build
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      release-commit-target: branch
      next-version: ${{ inputs.next-version }}
      slack-channel-id: C03D20YPU2K # #gardener-dwd
